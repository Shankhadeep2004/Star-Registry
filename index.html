<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Star Registry</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green:#1a6b3a; --green-mid:#2d9653; --green-light:#e8f5ee; --green-pale:#f2faf5;
  --surface:#ffffff; --bg:#f0f4f1; --border:rgba(0,0,0,0.08); --border-md:rgba(0,0,0,0.14);
  --text:#111827; --muted:#6b7280; --danger:#dc2626; --danger-bg:#fef2f2;
  --radius:12px; --radius-lg:18px;
}
html,body { min-height:100vh; background:var(--bg); font-family:'DM Sans',sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; }
.shell { max-width:430px; margin:0 auto; min-height:100vh; padding-bottom:40px; }

.header { background:var(--green); padding:36px 22px 52px; position:relative; overflow:hidden; }
.header::before { content:''; position:absolute; top:-60px; right:-60px; width:200px; height:200px; border-radius:50%; background:rgba(255,255,255,0.06); }
.header::after  { content:''; position:absolute; bottom:-40px; left:-30px; width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,0.04); }
.badge { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.15); border-radius:20px; padding:5px 14px; font-size:11px; color:rgba(255,255,255,0.85); letter-spacing:0.8px; text-transform:uppercase; margin-bottom:16px; font-weight:600; }
.header-title { font-family:'DM Serif Display',serif; font-size:34px; color:white; line-height:1.1; margin-bottom:8px; }
.header-sub { font-size:13px; color:rgba(255,255,255,0.5); }

.card { background:var(--surface); margin:-20px 14px 14px; border-radius:var(--radius-lg); border:0.5px solid var(--border); padding:24px 20px; box-shadow:0 4px 24px rgba(0,0,0,0.07); position:relative; z-index:1; }
.section-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1.4px; color:var(--green); margin-bottom:14px; }
.divider { border:none; border-top:0.5px solid var(--border); margin:20px 0; }
.field { margin-bottom:14px; }
.field:last-child { margin-bottom:0; }
.field-label { font-size:12px; color:var(--muted); margin-bottom:6px; display:block; font-weight:500; }
.field-input { width:100%; height:48px; border-radius:var(--radius); border:1px solid var(--border-md); background:var(--bg); padding:0 14px; font-size:15px; color:var(--text); font-family:'DM Sans',sans-serif; outline:none; transition:all 0.15s; -webkit-appearance:none; appearance:none; }
.field-input:focus { border-color:var(--green-mid); box-shadow:0 0 0 3px rgba(45,150,83,0.12); background:#fff; }
.field-input::placeholder { color:#b0b8c1; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.amt-wrap { position:relative; }
.amt-prefix { position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:15px; color:var(--muted); font-weight:600; pointer-events:none; }
.amt-wrap .field-input { padding-left:28px; }

/* UPLOAD TABS */
.upload-tabs { display:flex; gap:6px; margin-bottom:12px; }
.upload-tab { flex:1; height:38px; border-radius:10px; border:1px solid var(--border-md); background:var(--bg); color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all 0.15s; }
.upload-tab.active { background:var(--green); color:white; border-color:var(--green); }

/* PHOTO UPLOAD */
#f-photo { display:none; }
#f-file  { display:none; }
.upload-label { display:block; border:1.5px dashed var(--border-md); border-radius:var(--radius); padding:26px 16px; text-align:center; cursor:pointer; background:var(--bg); transition:all 0.2s; -webkit-tap-highlight-color:transparent; }
.upload-label:hover { border-color:var(--green-mid); background:var(--green-light); }
.upload-label.has-file { border-style:solid; border-color:var(--green-mid); background:var(--green-pale); padding:12px; }
.upload-icon-wrap { width:46px; height:46px; border-radius:50%; background:var(--green-light); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; font-size:22px; }
.upload-label:hover .upload-icon-wrap { background:white; }
.upload-text { font-size:13px; color:var(--muted); line-height:1.7; }
.upload-text strong { color:var(--green); font-weight:600; display:block; font-size:14px; }
.preview-img { width:100%; max-height:180px; object-fit:cover; border-radius:10px; display:none; }
.file-name { font-size:12px; color:var(--green); margin-top:8px; font-weight:600; display:none; word-break:break-all; }
.file-info-box { display:none; background:var(--green-pale); border:1px solid rgba(45,150,83,0.25); border-radius:10px; padding:12px 14px; margin-top:4px; }
.file-info-box .fi-name { font-size:13px; font-weight:600; color:var(--green); margin-bottom:2px; word-break:break-all; }
.file-info-box .fi-size { font-size:11px; color:var(--muted); }
.change-btn { display:none; margin-top:10px; width:100%; height:36px; border-radius:8px; border:1px solid var(--border-md); background:white; color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif; }

.student-box { border:1px solid var(--border); background:var(--bg); border-radius:14px; padding:14px; margin-bottom:12px; animation:slideIn 0.25s ease; }
.student-box:focus-within { border-color:rgba(45,150,83,0.4); }
@keyframes slideIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.student-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.student-title { font-size:13px; font-weight:600; color:var(--green); }
.remove-btn { border:none; background:#fee2e2; color:#dc2626; padding:6px 12px; border-radius:8px; font-size:12px; cursor:pointer; font-weight:600; }
.add-btn { width:100%; height:48px; border-radius:var(--radius); border:1.5px dashed var(--green-mid); background:var(--green-pale); color:var(--green); font-size:14px; font-weight:600; cursor:pointer; margin-top:4px; font-family:'DM Sans',sans-serif; }
.add-btn:hover { background:var(--green-light); }

.progress-section { display:none; margin-top:20px; }
.progress-section.visible { display:block; animation:fadeIn 0.3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.prog-bar-track { height:6px; background:#dde9e3; border-radius:99px; overflow:hidden; margin-bottom:16px; }
.prog-bar-fill { height:100%; background:linear-gradient(90deg,var(--green-mid),var(--green)); border-radius:99px; width:0%; transition:width 0.5s cubic-bezier(0.4,0,0.2,1); }
.prog-steps { display:flex; flex-direction:column; gap:8px; }
.prog-step { display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:12px; border:0.5px solid var(--border); background:var(--bg); transition:all 0.3s ease; opacity:0.45; }
.prog-step.active { border-color:rgba(45,150,83,0.4); background:var(--green-light); opacity:1; }
.prog-step.done   { border-color:rgba(26,107,58,0.3); background:var(--green-pale); opacity:1; }
.prog-step.error  { border-color:rgba(220,38,38,0.3); background:var(--danger-bg); opacity:1; }
.prog-step-icon { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; background:white; color:var(--muted); border:1.5px solid var(--border-md); flex-shrink:0; transition:all 0.3s; }
.prog-step.active .prog-step-icon { background:var(--green-mid); color:white; border-color:var(--green-mid); animation:pulse 1.2s ease infinite; }
.prog-step.done   .prog-step-icon { background:var(--green); color:white; border-color:var(--green); }
.prog-step.error  .prog-step-icon { background:var(--danger-bg); color:var(--danger); border-color:rgba(220,38,38,0.4); }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(45,150,83,0.35)} 50%{box-shadow:0 0 0 6px rgba(45,150,83,0)} }
.prog-step-label { font-size:13px; color:var(--muted); font-weight:500; transition:color 0.3s; }
.prog-step.active .prog-step-label { color:var(--green); }
.prog-step.done   .prog-step-label { color:#1a6b3a; }
.prog-step.error  .prog-step-label { color:var(--danger); }

.submit-btn { width:100%; height:54px; border-radius:var(--radius); border:none; background:var(--green); color:white; font-size:16px; font-weight:600; cursor:pointer; margin-top:18px; transition:all 0.2s; font-family:'DM Sans',sans-serif; }
.submit-btn:hover:not(:disabled) { background:#145c31; transform:translateY(-1px); box-shadow:0 4px 16px rgba(26,107,58,0.3); }
.submit-btn:disabled { background:#6b9e7e; cursor:not-allowed; }
.result-box { padding:14px 16px; border-radius:var(--radius); font-size:14px; font-weight:500; display:none; margin-top:14px; line-height:1.5; }
.result-box.ok  { background:var(--green-light); color:var(--green); border:0.5px solid rgba(45,150,83,0.4); }
.result-box.err { background:var(--danger-bg); color:var(--danger); border:0.5px solid rgba(220,38,38,0.3); }
.toast { margin:0 14px 16px; border-radius:var(--radius); padding:14px 16px; font-size:14px; font-weight:500; display:none; }
.toast.ok  { background:var(--green-light); color:var(--green); }
.toast.err { background:var(--danger-bg); color:var(--danger); }
.hidden { display:none; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <div class="badge">⭐ Star Registry</div>
    <div class="header-title">Award Stars</div>
    <div class="header-sub">Add multiple students instantly</div>
  </div>

  <div class="card">
    <div class="section-label">Basic Information</div>
    <div class="row2">
      <div class="field">
        <label class="field-label">Class</label>
        <input class="field-input" id="fixed-class" type="text" placeholder="e.g. 8">
      </div>
      <div class="field">
        <label class="field-label">Subject</label>
        <input class="field-input" id="f-subject" type="text" placeholder="Subject">
      </div>
    </div>

    <hr class="divider">
    <div class="section-label">Attachment</div>

    <!-- TABS -->
    <div class="upload-tabs">
      <button class="upload-tab active" id="tab-photo" type="button" onclick="switchTab('photo')">📷 Photo</button>
      <button class="upload-tab" id="tab-file" type="button" onclick="switchTab('file')">📄 File</button>
    </div>

    <!-- PHOTO UPLOAD -->
    <div id="photo-upload-area">
      <input type="file" id="f-photo" accept="image/jpeg,image/png,image/gif,image/webp">
      <label class="upload-label" id="upload-label-photo" for="f-photo" onclick="return checkBeforeUpload(event,'photo')">
        <div id="upload-placeholder-photo">
          <div class="upload-icon-wrap">🖼️</div>
          <div class="upload-text">
            <strong>Tap to choose a photo</strong>
            Select JPG, PNG or GIF from your device
          </div>
        </div>
        <img class="preview-img" id="preview-img" alt="Preview">
        <div class="file-name" id="photo-file-name"></div>
      </label>
      <button class="change-btn" id="change-photo-btn" type="button" onclick="document.getElementById('f-photo').click()">Change Photo</button>
    </div>

    <!-- FILE UPLOAD -->
    <div id="file-upload-area" class="hidden">
      <input type="file" id="f-file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv">
      <label class="upload-label" id="upload-label-file" for="f-file" onclick="return checkBeforeUpload(event,'file')">
        <div id="upload-placeholder-file">
          <div class="upload-icon-wrap">📎</div>
          <div class="upload-text">
            <strong>Tap to choose a file</strong>
            PDF, Word, Excel, PowerPoint, TXT, CSV
          </div>
        </div>
        <div class="file-info-box" id="file-info-box">
          <div class="fi-name" id="fi-name"></div>
          <div class="fi-size" id="fi-size"></div>
        </div>
      </label>
      <button class="change-btn" id="change-file-btn" type="button" onclick="document.getElementById('f-file').click()">Change File</button>
    </div>

    <div id="teacher-section" class="hidden">
      <hr class="divider">
      <div class="section-label">Teacher Information</div>
      <div class="field">
        <label class="field-label">Teacher Name</label>
        <input class="field-input" id="f-teacher" type="text" placeholder="Enter teacher name" oninput="maybeShowStudents()">
      </div>
    </div>

    <div id="students-section" class="hidden">
      <hr class="divider">
      <div class="section-label">Students</div>
      <div id="students-wrap"></div>
      <button class="add-btn" type="button" onclick="addStudent()">+ Add Another Student</button>

      <div class="progress-section" id="progress-section">
        <div class="prog-bar-track"><div class="prog-bar-fill" id="prog-bar"></div></div>
        <div class="prog-steps">
          <div class="prog-step" id="step-1"><div class="prog-step-icon" id="step-icon-1">1</div><div class="prog-step-label">Preparing student data</div></div>
          <div class="prog-step" id="step-2"><div class="prog-step-icon" id="step-icon-2">2</div><div class="prog-step-label">Uploading attachment to Drive</div></div>
          <div class="prog-step" id="step-3"><div class="prog-step-icon" id="step-icon-3">3</div><div class="prog-step-label">Saving to spreadsheet</div></div>
          <div class="prog-step" id="step-4"><div class="prog-step-icon" id="step-icon-4">4</div><div class="prog-step-label">Confirming submission</div></div>
        </div>
        <div class="result-box" id="result-box"></div>
      </div>

      <button class="submit-btn" id="submit-btn" type="button" onclick="submitForm()">Submit All Stars</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJl0AmHxG57H9xFNzjIa0F9ADraK4Ealuyh_jPW0S-PbMOK6pDcM7DzSgU2quXeaqbJA/exec";

let attachBase64 = "", attachName = "", attachMime = "";
let studentCount = 0, studentSectionShown = false, isSubmitting = false;
let currentTab = "photo";

const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad   = n  => String(n).padStart(2, "0");

function getToday()     { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function getExpiry()    { const d=new Date(); d.setMonth(d.getMonth()+6); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function getTimestamp() { const d=new Date(); return getToday()+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds()); }

function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast "+type; t.style.display = "block";
  setTimeout(function(){ t.style.display = "none"; }, 4500);
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById("tab-photo").className = "upload-tab" + (tab==="photo" ? " active" : "");
  document.getElementById("tab-file").className  = "upload-tab" + (tab==="file"  ? " active" : "");
  document.getElementById("photo-upload-area").classList.toggle("hidden", tab !== "photo");
  document.getElementById("file-upload-area").classList.toggle("hidden",  tab !== "file");
  // clear previous attachment when switching tabs
  clearAttachment();
}

function clearAttachment() {
  attachBase64 = ""; attachName = ""; attachMime = "";
  document.getElementById("f-photo").value = "";
  document.getElementById("f-file").value = "";
  // reset photo UI
  document.getElementById("preview-img").style.display = "none";
  document.getElementById("preview-img").src = "";
  document.getElementById("upload-placeholder-photo").style.display = "block";
  document.getElementById("photo-file-name").style.display = "none";
  document.getElementById("upload-label-photo").classList.remove("has-file");
  document.getElementById("change-photo-btn").style.display = "none";
  // reset file UI
  document.getElementById("file-info-box").style.display = "none";
  document.getElementById("upload-placeholder-file").style.display = "block";
  document.getElementById("upload-label-file").classList.remove("has-file");
  document.getElementById("change-file-btn").style.display = "none";
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + " KB";
  return (bytes/1048576).toFixed(1) + " MB";
}

function checkBeforeUpload(e, type) {
  if (attachBase64 && currentTab === type) { e.preventDefault(); return false; }
  const cls = document.getElementById("fixed-class").value.trim();
  const sub = document.getElementById("f-subject").value.trim();
  if (!cls || !sub) {
    e.preventDefault();
    showToast("Please fill class and subject first", "err");
    return false;
  }
  return true;
}

// PHOTO CHANGE
document.getElementById("f-photo").addEventListener("change", function() {
  const file = this.files[0];
  if (!file) return;
  const cls = document.getElementById("fixed-class").value.trim();
  const sub = document.getElementById("f-subject").value.trim();
  if (!cls || !sub) { showToast("Please fill class and subject first", "err"); this.value=""; return; }
  const reader = new FileReader();
  reader.onload = function(ev) {
    attachBase64 = ev.target.result.split(",")[1];
    attachName   = file.name;
    attachMime   = file.type || "image/jpeg";
    const img = document.getElementById("preview-img");
    img.src = ev.target.result; img.style.display = "block";
    document.getElementById("upload-placeholder-photo").style.display = "none";
    const fn = document.getElementById("photo-file-name");
    fn.textContent = "Selected: " + file.name; fn.style.display = "block";
    document.getElementById("upload-label-photo").classList.add("has-file");
    document.getElementById("change-photo-btn").style.display = "block";
    document.getElementById("teacher-section").classList.remove("hidden");
  };
  reader.readAsDataURL(file);
});

// FILE CHANGE
document.getElementById("f-file").addEventListener("change", function() {
  const file = this.files[0];
  if (!file) return;
  const cls = document.getElementById("fixed-class").value.trim();
  const sub = document.getElementById("f-subject").value.trim();
  if (!cls || !sub) { showToast("Please fill class and subject first", "err"); this.value=""; return; }
  if (file.size > 10 * 1024 * 1024) { showToast("File too large. Max 10MB allowed.", "err"); this.value=""; return; }
  const reader = new FileReader();
  reader.onload = function(ev) {
    attachBase64 = ev.target.result.split(",")[1];
    attachName   = file.name;
    attachMime   = file.type || "application/octet-stream";
    document.getElementById("upload-placeholder-file").style.display = "none";
    document.getElementById("fi-name").textContent = file.name;
    document.getElementById("fi-size").textContent = formatBytes(file.size);
    document.getElementById("file-info-box").style.display = "block";
    document.getElementById("upload-label-file").classList.add("has-file");
    document.getElementById("change-file-btn").style.display = "block";
    document.getElementById("teacher-section").classList.remove("hidden");
  };
  reader.readAsDataURL(file);
});

function maybeShowStudents() {
  const t = document.getElementById("f-teacher").value.trim();
  if (t && !studentSectionShown) {
    studentSectionShown = true;
    document.getElementById("students-section").classList.remove("hidden");
    addStudent();
  }
}

function addStudent() {
  studentCount++;
  const div = document.createElement("div");
  div.className = "student-box";
  const removeBtn = studentCount > 1 ? '<button class="remove-btn" type="button">Remove</button>' : '';
  div.innerHTML = [
    '<div class="student-head">',
      '<div class="student-title">Student ' + studentCount + '</div>',
      removeBtn,
    '</div>',
    '<div class="field">',
      '<label class="field-label">Student Name</label>',
      '<input class="field-input student-name" type="text" placeholder="Enter student name">',
    '</div>',
    '<div class="field">',
      '<label class="field-label">Star Amount</label>',
      '<div class="amt-wrap">',
        '<span class="amt-prefix">#</span>',
        '<input class="field-input student-amount" type="number" placeholder="0" min="1" inputmode="numeric">',
      '</div>',
    '</div>',

  ].join('');
  if (studentCount > 1) {
    div.querySelector(".remove-btn").addEventListener("click", function() {
      this.closest(".student-box").remove();
    });
  }
  document.getElementById("students-wrap").appendChild(div);
}

const BAR_PCT = {1:18, 2:48, 3:78, 4:100};
function setBar(pct) { document.getElementById("prog-bar").style.width = pct + "%"; }
function setStep(n, state) {
  const s = document.getElementById("step-"+n), ic = document.getElementById("step-icon-"+n);
  if (!s || !ic) return;
  s.className = "prog-step " + state;
  ic.textContent = state==="done" ? "✓" : state==="error" ? "✕" : String(n);
  if (BAR_PCT[n]) setBar(BAR_PCT[n]);
}
function resetSteps() {
  for (let i=1; i<=4; i++) {
    const s=document.getElementById("step-"+i), ic=document.getElementById("step-icon-"+i);
    if (s)  s.className = "prog-step";
    if (ic) ic.textContent = String(i);
  }
  setBar(0);
  const rb = document.getElementById("result-box");
  rb.style.display = "none"; rb.className = "result-box"; rb.textContent = "";
}
function showResult(msg, type) {
  const rb = document.getElementById("result-box");
  rb.textContent = msg; rb.className = "result-box " + type; rb.style.display = "block";
}
function showProgressSection(v) {
  const ps = document.getElementById("progress-section");
  if (v) { ps.classList.add("visible"); ps.style.display = "block"; }
  else   { ps.classList.remove("visible"); ps.style.display = "none"; }
}

async function submitForm() {
  if (isSubmitting) return;
  const cls = document.getElementById("fixed-class").value.trim();
  const sub = document.getElementById("f-subject").value.trim();
  const tch = document.getElementById("f-teacher").value.trim();
  if (!cls || !sub || !tch) { showToast("Please fill class, subject and teacher", "err"); return; }
  if (!attachBase64)        { showToast("Please upload a photo or file first", "err"); return; }

  const names   = document.querySelectorAll(".student-name");
  const amounts = document.querySelectorAll(".student-amount");
  const students = [];
  for (let i=0; i<names.length; i++) {
    const n = names[i].value.trim();
    const a = amounts[i].value.trim();
    if (!n || !a) { showToast("Please fill all student details", "err"); return; }
    students.push({
      timestamp: getTimestamp(), date: getToday(), student_name: n,
      class: cls, star_type: "normal_star", amount: Number(a),
      reason: "micro test", expiry_date: getExpiry(), active: "active",
      teacher_name: tch, subject: sub,
      photo: attachBase64, photo_name: attachName, photo_mime: attachMime
    });
  }

  isSubmitting = true;
  const btn = document.getElementById("submit-btn");
  btn.disabled = true; btn.textContent = "Submitting...";
  showProgressSection(true); resetSteps();
  let hadError = false;

  try {
    setStep(1, "active"); await sleep(380); setStep(1, "done");
    setStep(2, "active");
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type": "text/plain"},
      body: JSON.stringify({students: students})
    });
    await sleep(1300); setStep(2, "done");
    setStep(3, "active"); await sleep(950); setStep(3, "done");
    setStep(4, "active"); await sleep(400); setStep(4, "done");
    showResult("All stars submitted! Check your Google Sheet.", "ok");
    btn.textContent = "Submitted!";
    await sleep(3000);
    resetForm();
  } catch(err) {
    hadError = true;
    for (let i=1; i<=4; i++) {
      const s = document.getElementById("step-"+i);
      if (s && s.classList.contains("active")) { setStep(i, "error"); break; }
    }
    showResult("Network error: " + err.message + ". Please try again.", "err");
    btn.textContent = "Retry"; btn.disabled = false; isSubmitting = false;
  }
  if (!hadError) isSubmitting = false;
}

function resetForm() {
  ["fixed-class","f-subject","f-teacher"].forEach(function(id){ document.getElementById(id).value=""; });
  clearAttachment();
  document.getElementById("teacher-section").classList.add("hidden");
  document.getElementById("students-section").classList.add("hidden");
  document.getElementById("students-wrap").innerHTML = "";
  showProgressSection(false); resetSteps();
  const btn = document.getElementById("submit-btn");
  btn.textContent = "Submit All Stars"; btn.disabled = false;
  studentCount=0; studentSectionShown=false; isSubmitting=false;
  switchTab("photo");
}
</script>
</body>
</html>
